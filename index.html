<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Shukr Founder Command Centre</title>
<style>
:root{--bg:#0b0d12;--panel:#12151d;--panel2:#181c26;--line:#262b38;--text:#e8eaf0;--muted:#9aa3b5;--dim:#6b7385;--accent:#ff6a55;--accent2:#e0304a;--gold:#e9b949;--a:#ff7a5c;--b:#5aa9ff;--c:#a78bfa;--r:#34d399;--u:#f59e0b;--d:#f472b6}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--gold)}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.brand{font-weight:800;letter-spacing:.08em;font-size:13px;color:var(--muted)}
.brand b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:22px;margin:6px 0 4px}
input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;font-size:15px}
button{background:linear-gradient(90deg,var(--accent),var(--accent2));border:0;color:#fff;font-weight:700;border-radius:10px;padding:12px 16px;cursor:pointer;font-size:14px}
.err{color:#f87171;min-height:20px;font-size:13px}
#app{display:none}
header{position:sticky;top:0;z-index:5;background:rgba(11,13,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 18px}
header .t{font-weight:800;letter-spacing:.06em;font-size:14px}
header .s{color:var(--dim);font-size:12px;margin-left:auto}
#menuBtn{display:none;background:var(--panel2);padding:8px 10px}
.wrap{display:flex}
nav{width:250px;flex:none;height:calc(100vh - 53px);position:sticky;top:53px;overflow:auto;border-right:1px solid var(--line);padding:10px}
nav a{display:flex;gap:10px;align-items:center;color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:8px;font-size:13px}
nav a:hover,nav a.on{background:var(--panel2);color:var(--text)}
nav a span{color:var(--dim);width:20px;font-size:11px}
main{flex:1;min-width:0;padding:20px;max-width:1200px}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;scroll-margin-top:70px}
section h2{margin:0 0 4px;font-size:17px}
.sub{color:var(--dim);font-size:12px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-size:24px;font-weight:800}.kpi .l{color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line)}
.unagreed{background:#3b1d0a;color:#fbbf24;border-color:#78350f}
.ok{background:#052e1c;color:#34d399;border-color:#065f46}.bad{background:#3a0d12;color:#f87171;border-color:#7f1d1d}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
.tbl{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.feed .it{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.it .m{color:var(--dim);font-size:11.5px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:8px;overflow-x:auto}
.col{display:flex;flex-direction:column-reverse;min-width:22px;flex:1;max-width:44px}
.col div{width:100%}.cl{font-size:10px;color:var(--dim);text-align:center;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.empty{color:var(--dim);font-style:italic;font-size:13px}
.search{margin-bottom:10px}
.note{font-size:12px;color:var(--muted);background:var(--panel2);border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;margin:8px 0}
code{font-size:11.5px;color:#cbd5e1}
@media(max-width:860px){nav{position:fixed;left:0;top:53px;background:var(--bg);z-index:4;transform:translateX(-100%);transition:.2s;height:calc(100vh - 53px)}nav.open{transform:none}#menuBtn{display:block}main{padding:12px}.grid2{grid-template-columns:1fr}header .s{display:none}}
</style>
</head>
<body>
<div id="lock"><form class="lockbox" id="lf">
  <div class="brand"><b>SHUKR</b> · FOUNDER</div>
  <h1>Founder Command Centre</h1>
  <p style="color:var(--muted);font-size:13px">Data on this page is AES-256 encrypted. Enter the passphrase to decrypt it in your browser. Nothing is sent anywhere.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Passphrase" autofocus>
  <label style="display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;margin:10px 0"><input type="checkbox" id="rem" style="width:auto"> Remember on this device (session only)</label>
  <div class="err" id="err"></div>
  <button style="width:100%">Unlock</button>
</form></div>

<div id="app">
<header><button id="menuBtn" aria-label="Menu">☰</button><div class="t">SHUKR FOUNDER COMMAND CENTRE</div><div class="s" id="gen"></div><button id="lockBtn" style="padding:7px 12px;background:var(--panel2)">Lock</button></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
</div>

<script>
const SECTIONS=[["overview","Executive Overview"],["live","Live Development Activity"],["timeline","Development Timeline"],["akmal","Akmal's Contribution Register"],["terminus","Terminus Contribution Register"],["ai","AI-Assisted Development Register"],["arch","Product Architecture"],["ip","Intellectual Property Inventory"],["brand","Branding and Product Assets"],["infra","Infrastructure and API Resource Ledger"],["evidence","Evidence Archive"],["agreements","Founder Agreements"],["employment","Employment Contract Risk Tracker"],["ownership","Ownership Proposal Tracker"],["milestones","Product Milestones"],["growth","User Growth"],["revenue","Revenue Tracking"],["invest","Investment and Acquisition Milestones"],["decisions","Outstanding Decisions"],["status","Backup and Automation Status"]];
const COL={A:"var(--a)",B:"var(--b)",C:"var(--c)",R:"var(--r)",U:"var(--u)",D:"var(--d)",E:"#94a3b8"};
const CN={A:"Akmal",B:"Terminus",C:"AI-assisted",R:"Infrastructure",U:"Unattributed",D:"Joint",E:"Third party"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(blob,pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(blob.salt),iterations:blob.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(blob.iv)},key,b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pw){
  const r=await fetch("data.enc.json?t="+Date.now(),{cache:"no-store"});
  const blob=await r.json();
  const d=await decrypt(blob,pw);
  if($("#rem").checked||sessionStorage.getItem("fcc"))sessionStorage.setItem("fcc",pw);
  render(d);
}
$("#lf").addEventListener("submit",async e=>{e.preventDefault();$("#err").textContent="Decrypting…";try{await unlock($("#pw").value)}catch(x){$("#err").textContent="Wrong passphrase or data unavailable."}});
$("#lockBtn").onclick=()=>{sessionStorage.removeItem("fcc");location.reload()};
$("#menuBtn").onclick=()=>$("#nav").classList.toggle("open");
if(sessionStorage.getItem("fcc"))unlock(sessionStorage.getItem("fcc")).catch(()=>sessionStorage.removeItem("fcc"));

const fmt=t=>t?String(t).replace("T"," ").replace("Z"," UTC").slice(0,20):"";
const tbl=(cols,rows,empty)=>rows&&rows.length?`<div class="tbl"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:`<div class="empty">${empty||"No records yet."}</div>`;
const sec=(id,n,title,sub,body)=>`<section id="${id}"><h2>${n}. ${title}</h2><div class="sub">${sub||""}</div>${body}</section>`;
const regTable=rows=>tbl([["Date",r=>fmt(r.ts)],["Type",r=>esc(r.type)],["Description",r=>esc(r.desc)],["Source",r=>`<code>${esc(r.src)}</code>`],["Verification",r=>esc(r.ver)]],rows);
const kpi=(v,l)=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
const manualList=(arr,cols,empty)=>tbl(cols,arr||[],empty);

function render(d){
  $("#lock").style.display="none";$("#app").style.display="block";
  $("#gen").textContent="Data generated "+fmt(d.generated_at);
  $("#nav").innerHTML=SECTIONS.map((s,i)=>`<a href="#${s[0]}"><span>${i+1}</span>${s[1]}</a>`).join("");
  $("#nav").onclick=e=>{if(e.target.closest("a"))$("#nav").classList.remove("open")};
  const o=d.overview,bc=o.by_class||{},tot=Object.values(bc).reduce((a,b)=>a+b,0)||1,st=d.status||{};
  const days=Object.keys(d.by_day||{}).sort();const mx=Math.max(1,...days.map(k=>Object.values(d.by_day[k]).reduce((a,b)=>a+b,0)));
  const own=d.ownership||{},prop=own.proposal||{};
  const types=Object.entries(d.akmal_types||{}).sort((a,b)=>b[1]-a[1]);const tmax=Math.max(1,...types.map(t=>t[1]));
  let h="";
  h+=sec("overview",1,"Executive Overview","Shukr — Muslim-focused companion, social media and short-form video platform. Founder: Akmal Nimaladasa. Technology partner: Terminus.",
   `<div class="kpis">${kpi(o.records,"Activity records")}${kpi(bc.A||0,"Akmal records")}${kpi(bc.B||0,"Terminus records")}${kpi(bc.C||0,"AI-assisted records")}${kpi(bc.R||0,"Infrastructure records")}${kpi(o.evidence_files,"Evidence files")}${kpi(o.ai_sessions,"AI sessions")}${kpi(`<span class="pill unagreed">${esc(o.ownership_status)}</span>`,"Ownership 60/40 proposal")}</div>
   <div style="margin-top:14px"><div class="bar">${Object.entries(bc).map(([k,v])=>`<div style="width:${v/tot*100}%;background:${COL[k]}" title="${CN[k]} ${v}"></div>`).join("")}</div>
   <div class="legend">${Object.entries(bc).map(([k,v])=>`<span><i style="background:${COL[k]}"></i>${CN[k]} ${v}</span>`).join("")}</div></div>
   <div class="note">Records show observed activity with sources. Counts are not a measure of value or ownership. Founder recognition and development activity do not by themselves establish legal ownership.</div>
   <div class="sub">First record ${fmt(o.first_record)} · last ${fmt(o.last_record)} · live app <a href="${esc(d.app_url)}" target="_blank" rel="noopener">${esc(d.app_url)}</a></div>`);
  h+=sec("live",2,"Live Development Activity","Latest 300 records, newest first. Updated by the background monitor (every 15 min) and pushed here daily.",
   `<input class="search" id="fq" placeholder="Filter activity…"><div class="feed" id="feed"></div>`);
  h+=sec("timeline",3,"Development Timeline","Records per day by contributor class.",
   `<div class="chart">${days.map(k=>{const v=d.by_day[k];const tt=Object.values(v).reduce((a,b)=>a+b,0);return `<div><div class="col" style="height:130px" title="${k}: ${tt}">${Object.entries(v).filter(x=>x[1]).map(([c,n])=>`<div style="height:${n/mx*130}px;background:${COL[c]}"></div>`).join("")}</div><div class="cl">${k.slice(5)}</div></div>`}).join("")}</div>
   <div class="legend">${Object.keys(CN).map(k=>`<span><i style="background:${COL[k]}"></i>${CN[k]}</span>`).join("")}</div>`);
  h+=sec("akmal",4,"Akmal's Contribution Register","Founder instructions, design decisions, testing feedback and commits. Source: Hermes session store and git.",
   `<div style="margin-bottom:12px">${types.map(([t,n])=>`<div style="display:flex;gap:8px;align-items:center;font-size:12px;margin:3px 0"><div style="width:230px;color:var(--muted)">${esc(t)}</div><div style="flex:1"><div style="height:8px;border-radius:4px;background:var(--a);width:${n/tmax*100}%"></div></div><div style="width:30px">${n}</div></div>`).join("")}</div>`+regTable(d.registers.A));
  h+=sec("terminus",5,"Terminus Contribution Register","Developer work by Terminus or other authorised contributors (git commits under non-Akmal identities, or attested entries).",
   regTable(d.registers.B)+`<div class="note">No Terminus developer activity is visible on this host yet. Add confirmed contributions with <code>founder.py log --class B</code>; they stay marked unverified until confirmed.</div>`+(d.registers.D.length?"<h3>Joint</h3>"+regTable(d.registers.D):"")+(d.registers.E.length?"<h3>Third parties</h3>"+regTable(d.registers.E):""));
  h+=sec("ai",6,"AI-Assisted Development Register","Code and content generated by AI agents, with the directing person where the session evidence shows it.",
   tbl([["Session",s=>esc(s.title||s.id)],["Kind",s=>esc(s.source)],["Model",s=>esc(s.model)],["First",s=>fmt(s.first)],["Last",s=>fmt(s.last)],["Tool msgs",s=>s.tool_msgs]],d.sessions)+`<h3 style="font-size:14px">AI activity records</h3>`+regTable(d.registers.C)+(d.registers.U.length?`<h3 style="font-size:14px;color:var(--u)">Unattributed changes</h3>`+regTable(d.registers.U):""));
  h+=sec("arch",7,"Product Architecture","Derived from the source tree.",
   `<div class="grid2"><div><b>Stack</b><ul>${d.architecture.stack.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div><div><b>Modules (${d.architecture.modules.length})</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${d.architecture.modules.map(m=>`<span class="pill">${esc(m)}</span>`).join("")}</div></div></div>`);
  h+=sec("ip",8,"Intellectual Property Inventory","Not a legal opinion.",
   tbl([["Asset",r=>esc(r.asset)],["Category",r=>esc(r.category)],["Evidence",r=>esc(r.evidence)],["Status",r=>esc(r.status)]],d.ip)+`<h3 style="font-size:14px">Third-party libraries</h3>`+tbl([["Package",r=>esc(r.name)],["Version",r=>esc(r.version)],["Licence",r=>esc(r.license)]],d.libraries)+`<h3 style="font-size:14px">Content licences</h3>`+tbl([["Item",r=>esc(r.title)],["Group",r=>esc(r.group)],["Status",r=>esc(r.status)]],d.licences));
  h+=sec("brand",9,"Branding and Product Assets","",manualList(d.manual.branding,[["Asset",r=>esc(r.asset)],["Status",r=>esc(r.status)]]));
  h+=sec("infra",10,"Infrastructure and API Resource Ledger","Resources contributed (mainly Terminus / Roar AI).",
   manualList(d.manual.resources,[["Provider",r=>esc(r.provider)],["Resource",r=>esc(r.resource)],["Evidence",r=>`<code>${esc(r.evidence)}</code>`]])+`<h3 style="font-size:14px">Roar deploys (snapshot)</h3>`+tbl([["Deploy",r=>`<code>${esc(r.id)}</code>`],["Created",r=>fmt(r.created)],["Status",r=>esc(r.status)]],d.deploys)+`<h3 style="font-size:14px">Deploy requests seen in AI sessions</h3>`+regTable(d.registers.R));
  h+=sec("evidence",11,"Evidence Archive","Searchable index of the local vault. Files themselves are not published here.",
   `<input class="search" id="eq" placeholder="Search evidence (path, category, source, hash)…"><div id="ev"></div>`);
  h+=sec("agreements",12,"Founder Agreements","Drafts are NOT legally binding and need review by a qualified Sri Lankan lawyer.",
   tbl([["Document",r=>esc(r.doc)],["Status",r=>esc(r.status)],["Signed",r=>r.signed?'<span class="pill ok">Yes</span>':'<span class="pill bad">No</span>']],d.agreements));
  h+=sec("employment",13,"Employment Contract Risk Tracker","",tbl([["Area",r=>esc(r.area)],["Risk",r=>esc(r.risk)],["Status",r=>esc(r.status)]],d.employment_risks));
  h+=sec("ownership",14,"Ownership Proposal Tracker","",
   `<div class="kpis">${kpi(prop.akmal_pct+"%","Akmal (proposed)")}${kpi(prop.terminus_pct+"%","Terminus (proposed)")}${kpi(`<span class="pill unagreed">${esc(own.status)}</span>`,"Status")}</div>
   <div class="note">${esc(own.note)}</div><p style="font-size:13px"><b>Basis:</b> ${esc(prop.basis)}</p><p style="font-size:13px"><b>Founder recognition:</b> ${esc((own.founder_recognition||{}).statement)} — evidence: ${esc((own.founder_recognition||{}).evidence)}</p>`+
   tbl([["Date",r=>esc(r.date)],["Event",r=>esc(r.event)],["Source",r=>esc(r.source)]],own.history));
  h+=sec("milestones",15,"Product Milestones","",manualList(d.manual.milestones,[["Date",r=>esc(r.date)],["Milestone",r=>esc(r.title)],["Status",r=>esc(r.status)],["Source",r=>esc(r.source)]]));
  h+=sec("growth",16,"User Growth","Add figures to _system/manual/user_growth.json (date, users, active, source).",manualList(d.manual.user_growth,[["Date",r=>esc(r.date)],["Users",r=>esc(r.users)],["Active",r=>esc(r.active)],["Source",r=>esc(r.source)]],"No user-growth figures recorded yet."));
  h+=sec("revenue",17,"Revenue Tracking","",manualList(d.manual.revenue,[["Date",r=>esc(r.date)],["Amount",r=>esc(r.amount)],["Source",r=>esc(r.source)]],"No revenue recorded yet."));
  h+=sec("invest",18,"Investment and Acquisition Milestones","",manualList(d.manual.investment,[["Date",r=>esc(r.date)],["Event",r=>esc(r.title)],["Status",r=>esc(r.status)]],"No investment or acquisition events recorded."));
  h+=sec("decisions",19,"Outstanding Decisions","",manualList(d.manual.outstanding_decisions,[["Decision / action",r=>esc(r.title)],["Status",r=>r.status==="done"?'<span class="pill ok">done</span>':'<span class="pill unagreed">'+esc(r.status)+'</span>']]));
  const S=(k,l)=>`<tr><td>${l}</td><td>${typeof st[k]==="boolean"?(st[k]?'<span class="pill ok">OK</span>':'<span class="pill bad">FAIL</span>'):esc(fmt(st[k])||st[k]||"—")}</td></tr>`;
  h+=sec("status",20,"Backup and Automation Status","",`<div class="tbl"><table><tbody>${S("monitor_last_run","Monitor last run")}${S("monitor_ok","Monitor")}${S("daily_last_run","Daily pipeline last run")}${S("weekly_last_run","Weekly report last run")}${S("backup_daily_last","Daily backup")}${S("backup_daily_ok","Daily backup verified (restore test + 2nd copy)")}${S("backup_daily_msg","Daily backup check")}${S("backup_weekly_last","Weekly backup")}${S("backup_weekly_ok","Weekly backup verified")}${S("originals_verified","Originals verified (count)")}${S("originals_problems","Originals problems")}${S("private_last_push","Private GitHub sync")}${S("private_push_ok","Private GitHub push")}${S("dashboard_last_push","Dashboard data push")}${S("export_last","Last full export")}</tbody></table></div>
   <div class="sub" style="margin-top:8px">Daily reports: ${d.daily_reports.map(esc).join(", ")||"none"} · Weekly: ${d.weekly_reports.map(esc).join(", ")||"none"}</div>`);
  $("#main").innerHTML=h;
  const feed=q=>{const rows=d.activity.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q)).slice(0,300);$("#feed").innerHTML=rows.map(r=>`<div class="it"><div class="dot" style="background:${COL[r.class]}"></div><div><div>${esc(r.desc)}</div><div class="m">${fmt(r.ts)} · ${esc(CN[r.class]||r.class)} · ${esc(r.type)} · ${esc(r.who)}</div></div></div>`).join("")||'<div class="empty">No matches.</div>'};
  feed("");$("#fq").oninput=e=>feed(e.target.value.toLowerCase());
  const ev=q=>{const rows=d.evidence.filter(r=>!q||(r.p+r.c+r.src+r.h+r.t).toLowerCase().includes(q));$("#ev").innerHTML=`<div class="sub">${rows.length} of ${d.evidence.length} files</div>`+tbl([["File",r=>`<code>${esc(r.p)}</code>`],["Type",r=>esc(r.t)],["Size",r=>r.s.toLocaleString()],["SHA-256",r=>`<code>${esc(r.h)}…</code>`],["Source",r=>esc(r.src)]],rows.slice(0,500))};
  ev("");$("#eq").oninput=e=>ev(e.target.value.toLowerCase());
  const links=[...document.querySelectorAll("nav a")];
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}),{rootMargin:"-40% 0px -55% 0px"});
  document.querySelectorAll("section").forEach(s=>io.observe(s));
}
</script>
</body>
</html>
